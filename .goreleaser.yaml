version: 2

project_name: drkate

before:
  hooks:
    - go mod verify
    - sh -c "cd web && npm ci"
    - sh -c "cd web && npm run build"

builds:
  - id: drkate
    main: ./cmd/drkate
    binary: drkate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_amd64"
    files:
      - README.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
